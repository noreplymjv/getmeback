name: getmeback
description: GetMeBack - a playful virtual stress relief and venting app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.0
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  uuid: ^4.5.1
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/presets/
    - assets/sfx/
