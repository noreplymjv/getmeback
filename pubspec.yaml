name: getmeback
description: GetMeBack V1A — playful stress relief. Vent, smash rooms, then breathe calm.
publish_to: 'none'
version: 1.0.0-a1+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.0
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  uuid: ^4.5.1
  audioplayers: ^6.5.0
  web: ^1.1.1
  flutter_secure_storage: ^9.2.4
  sensors_plus: ^6.1.1
  noise_meter: ^5.0.2
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/presets/
    - assets/sfx/
    - assets/rooms/
    - assets/rooms/props/
