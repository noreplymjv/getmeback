<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GetMeBack — choose Linux or Chrome</title>
  <style>
    :root {
      --bg: #07060f;
      --panel: #1a1730cc;
      --text: #f7f4ff;
      --muted: #b7b0d0;
      --coral: #ff4d6d;
      --cyan: #7aefff;
      --gold: #ffd166;
      --calm: #5ee6a0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 20% 10%, #ff4d6d33, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #7aefff22, transparent 45%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(640px, 100%);
      background: var(--panel);
      border: 1px solid #ffffff14;
      border-radius: 22px;
      padding: 28px 26px 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px #00000066;
    }
    .eyebrow {
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 36px);
      letter-spacing: -0.5px;
      background: linear-gradient(120deg, #ff4d6d, #ff8a5c, #ffd166);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .sub {
      color: var(--muted);
      margin: 0 0 22px;
      line-height: 1.45;
      font-size: 15px;
    }
    .choices {
      display: grid;
      gap: 12px;
    }
    button.choice {
      appearance: none;
      border: 1px solid #ffffff18;
      border-radius: 16px;
      padding: 16px 18px;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      background: linear-gradient(135deg, #ffffff10, #ffffff06);
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    button.choice:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #ffd16666;
      background: linear-gradient(135deg, #ff4d6d33, #7aefff18);
    }
    button.choice:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    button.choice strong {
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
    }
    button.choice span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .linux strong { color: var(--cyan); }
    .chrome strong { color: var(--coral); }
    .row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .ghost {
      appearance: none;
      border: 1px solid #ffffff22;
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
    }
    .ghost:hover { color: var(--text); border-color: #ffffff44; }
    #status {
      margin-top: 16px;
      min-height: 1.4em;
      font-size: 13px;
      color: var(--calm);
      white-space: pre-wrap;
    }
    #status.err { color: #ff8a9a; }
    .tip {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    code {
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 11px;
      color: var(--gold);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">GetMeBack · local run</div>
    <h1>Where should it open?</h1>
    <p class="sub">
      Same app, two targets. <strong style="color:var(--text)">Linux</strong> is best for smash feel;
      <strong style="color:var(--text)">Chrome</strong> matches the online website.
    </p>

    <div class="choices">
      <button class="choice linux" id="btn-linux" type="button">
        <strong>1 · Linux desktop</strong>
        <span>Native window on this PC — recommended for Room Rampage &amp; everyday testing.</span>
      </button>
      <button class="choice chrome" id="btn-chrome" type="button">
        <strong>2 · Chrome (web)</strong>
        <span>Runs in the browser — closest to https://noreplymjv.github.io/getmeback/</span>
      </button>
    </div>

    <div class="row">
      <button class="ghost" id="btn-stop" type="button">Stop flutter run</button>
      <button class="ghost" id="btn-refresh" type="button">Check status</button>
    </div>

    <div id="status">Ready. Click Linux or Chrome.</div>
    <p class="tip">
      This page talks to a tiny local helper started by
      <code>scripts/START-run-chooser.sh</code>.
      Keep that terminal open while you use the app.
    </p>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const buttons = ["btn-linux", "btn-chrome", "btn-stop", "btn-refresh"].map(
      (id) => document.getElementById(id)
    );

    function setBusy(busy) {
      buttons.forEach((b) => {
        if (b.id === "btn-refresh") return;
        b.disabled = busy;
      });
    }

    function setStatus(msg, isErr) {
      statusEl.textContent = msg;
      statusEl.className = isErr ? "err" : "";
    }

    async function post(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });
      const data = await res.json().catch(() => ({ ok: false, message: "Bad response" }));
      return { res, data };
    }

    async function run(device) {
      setBusy(true);
      setStatus("Starting flutter run -d " + device + " …");
      try {
        const { data } = await post("/run", "device=" + encodeURIComponent(device));
        setStatus(data.message || (data.ok ? "Started." : "Failed."), !data.ok);
      } catch (e) {
        setStatus(
          "Chooser helper not running.\nStart: scripts/START-run-chooser.sh\n" + e,
          true
        );
      } finally {
        setBusy(false);
      }
    }

    document.getElementById("btn-linux").onclick = () => run("linux");
    document.getElementById("btn-chrome").onclick = () => run("chrome");
    document.getElementById("btn-stop").onclick = async () => {
      setBusy(true);
      try {
        const { data } = await post("/stop", "");
        setStatus(data.message || "Stopped.");
      } catch (e) {
        setStatus(String(e), true);
      } finally {
        setBusy(false);
      }
    };
    document.getElementById("btn-refresh").onclick = async () => {
      try {
        const res = await fetch("/status");
        const data = await res.json();
        setStatus(data.running ? "Flutter run is still active." : "No flutter run active.");
      } catch (e) {
        setStatus("Helper offline: " + e, true);
      }
    };
  </script>
</body>
</html>
