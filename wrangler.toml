# Cloudflare Worker static hosting — PREBUILT Flutter app (zero-config CI)
#
# Assets live in cf-dist/ (committed Flutter web build).
# Cloudflare only uploads files — no Flutter install on their servers.

name = "getmeback"
compatibility_date = "2026-08-20"
workers_dev = true

pages_build_output_dir = "cf-dist"

[assets]
directory = "cf-dist"
not_found_handling = "single-page-application"
run_worker_first = false
