# Cloudflare Pages (free) — GitHub connected
#
# IMPORTANT: Do NOT use output directory "web".
# That folder is only the Flutter HTML shell (~8 files).
# The real app is produced by: flutter build web → build/web
#
# Dashboard (Workers & Pages → getmeback → Settings → Builds):
#   Framework preset:     None
#   Build command:        bash scripts/cf-pages-build.sh
#   Build output dir:     build/web
#   Root directory:       /   (leave empty / project root)
#   Production branch:    master
#
# Or deploy via GitHub Actions (.github/workflows/deploy-cloudflare-pages.yml)
# using CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets.

name = "getmeback"
compatibility_date = "2026-08-20"

[assets]
# Used by `wrangler pages deploy` after a local/CI Flutter build.
directory = "build/web"
not_found_handling = "single-page-application"
