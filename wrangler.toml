# Cloudflare Workers + static assets (dashboard: workers/services/view/getmeback)
#
# Build (Workers Builds / CI): npm run build
#   → scripts/cf-pages-build.sh → flutter build web → build/web
#
# Assets MUST be build/web (never the source shell folder "web").

name = "getmeback"
compatibility_date = "2026-08-20"
workers_dev = true

# Pages-compatible field (harmless if this is a Worker)
pages_build_output_dir = "build/web"

[assets]
directory = "build/web"
not_found_handling = "single-page-application"
run_worker_first = false
